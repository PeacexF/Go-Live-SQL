<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live DB Explorer</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        textarea { width: 100%; height: 80px; background: #2d2d2d; color: #9cdcfe; border: 1px solid #3e3e3e; padding: 10px; font-family: monospace; }
        button { background: #0e639c; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        .table-container { margin-top: 20px; overflow-x: auto; background: #252526; border: 1px solid #454545; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #454545; text-align: left; }
        th { background: #333333; color: #fff; }
        .status { color: #6a9955; margin: 10px 0; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Live SQL Explorer</h1>
    <textarea id="sqlInput" placeholder="SELECT * FROM tasks;"></textarea>
    <button id="runBtn">Run Query</button>
    
    <div id="status" class="status">Ready.</div>

    <div class="table-container">
        <table id="resultTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
